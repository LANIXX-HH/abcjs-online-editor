<!DOCTYPE html><html lang="de" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ABC-Editor</title>
<style>
:root,[data-theme="light"]{
  --bg-page:#F2F3F5; --bg:#FFFFFF; --bg2:#EAECEF; --bg3:#DDE0E4; --border:#C8CDD4;
  --text:#1A1D21; --text2:#5A6070;
  --blue:#185FA5; --accent:#185FA5; --orange:#C94F00;
  --yellow:#f5d470; --yellowdim:#f8e6ad; --root:#e3863a; --caret:#C94F00;
  --off:#EAECEF; --offink:#9198A8; --ink:#1A1D21;
  --vc0:#185FA5; --vc1:#C94F00; --vc2:#1E5C0A; --vc3:#7A4AC0;
}
[data-theme="dark"]{
  --bg-page:#1A1C20; --bg:#23262C; --bg2:#2C2F38; --bg3:#363940; --border:#44474F;
  --text:#E4E6EB; --text2:#9198A8;
  --blue:#4D9EE8; --accent:#4D9EE8; --orange:#F07830;
  --yellow:#C9A43A; --yellowdim:#8a7420; --root:#D9772E; --caret:#F07830;
  --off:#2C2F38; --offink:#6a7080; --ink:#E4E6EB;
  --vc0:#4D9EE8; --vc1:#F07830; --vc2:#6FCF6F; --vc3:#B48AE8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg-page);transition:background .2s,color .2s}
button{font-family:inherit}

/* ---- layout ---- */
.app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr}
.voicebar{display:flex;gap:6px;padding:6px 10px;background:var(--bg2);border-bottom:1.5px solid var(--border);overflow-x:auto}
.voicebar[hidden]{display:none}
.vtab{flex:0 0 auto;border:1.5px solid var(--border);border-radius:9px;background:var(--bg);font-size:12px;font-weight:700;padding:5px 12px;cursor:pointer;border-left:5px solid var(--vc,#999)}
.vtab.active{background:var(--vc,#999);color:#fff;border-color:var(--vc,#999)}
.topbar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);border-bottom:1.5px solid var(--border)}
.tb-btn{border:1.5px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font-size:13px;font-weight:600;padding:6px 11px;cursor:pointer}
.tb-btn.on{background:var(--yellow);border-color:#caa52a}
.tb-title{font-weight:700;font-size:14px}
.spacer{flex:1}
.body{display:grid;grid-template-columns:1fr 128px;min-height:0;position:relative}
.result{position:relative;overflow:auto;background:var(--bg-page);padding:10px}
#paper{min-height:100%;background:#fff;border-radius:8px;padding:8px;box-shadow:0 1px 6px var(--shadow,rgba(0,0,0,.12))}
#paper .sel-note,#paper .sel-note *{fill:var(--accent,#e3863a)!important;stroke:var(--accent,#e3863a)!important}
#paper .abcjs-note{cursor:pointer}
#paper .abcjs-v0{fill:#185FA5}#paper .abcjs-v1{fill:#C94F00}#paper .abcjs-v2{fill:#1E5C0A}#paper .abcjs-v3{fill:#7A4AC0}
#hint{position:absolute;top:8px;left:10px;font-size:11px;color:var(--text2)}
.micmon{position:sticky;bottom:6px;margin:8px auto 0;width:max-content;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.micmon[hidden]{display:none}
.mm-note{font-weight:700;font-size:16px;min-width:34px;text-align:center}
.mm-freq{color:#cfc9bd;font-size:11px}
.mm-meter{width:70px;height:7px;background:#4a463f;border-radius:4px;overflow:hidden}
.mm-meter i{display:block;height:100%;width:0;background:var(--yellow)}
.mm-stop{background:var(--caret);border-radius:7px;padding:3px 9px;cursor:pointer;font-weight:700;font-size:12px}
.tb-btn.listening{background:var(--caret);border-color:var(--caret);color:#fff}

/* keyboard column */
.kbd{background:var(--bg2);border-left:1.5px solid var(--border);display:flex;flex-direction:column;min-height:0}
.kfnrow{display:flex;flex-direction:column;gap:4px;padding:6px 6px}
.kfn{border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:11px;font-weight:600;padding:6px 2px;cursor:pointer;text-align:center}
.kfn.y{background:var(--yellow);border-color:#caa52a}
.keys-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 0}
.keys{position:relative;margin:0 6px}
.wk{position:relative;border:1.5px solid var(--border);border-radius:8px;background:var(--off);height:38px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:13px;color:var(--offink);cursor:pointer;user-select:none}
.wk .sf{font-style:italic;font-weight:500;font-size:11px;opacity:.85}
.wk.inkey{background:var(--yellow);border-color:#caa52a;color:var(--ink)}
.wk.root{background:var(--root);border-color:#b5651d;color:var(--ink)}
.bk{position:absolute;left:2px;width:56%;height:24px;border-radius:6px;border:1.5px solid var(--border);background:var(--off);color:var(--offink);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;cursor:pointer;user-select:none;z-index:3}
.bk.inkey{background:#ecc24f;border-color:#b5651d;color:var(--ink)}
.bk.root{background:var(--root);border-color:#b5651d;color:var(--ink)}
.kactrow{display:flex;flex-direction:column;gap:4px;padding:6px 6px;border-top:1.5px solid var(--border)}

/* menu drawer */
.menu{position:absolute;top:0;left:0;bottom:0;width:86%;max-width:340px;background:var(--bg);border-right:1.5px solid var(--border);
      transform:translateX(-101%);transition:transform .22s ease;z-index:30;overflow:auto;box-shadow:2px 0 18px rgba(0,0,0,.18)}
.app.menu-open .menu{transform:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .22s;z-index:25}
.app.menu-open .backdrop{opacity:1;visibility:visible}
.menu h3{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);margin:12px 12px 6px}
.mrow{margin:0 12px 8px}
.mrow label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px}
.mrow input,.mrow select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:7px 8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px;border-bottom:1.5px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:1}
.mhead b{font-size:14px}
.mx{border:1.5px solid var(--border);border-radius:8px;background:var(--bg);font-size:14px;padding:4px 9px;cursor:pointer}
#abcTa{width:calc(100% - 24px);margin:0 12px 8px;height:120px;border:1.5px solid var(--border);border-radius:8px;padding:8px;font-family:ui-monospace,monospace;font-size:12px;resize:vertical;background:#fcfbf7}
.mact{display:flex;gap:6px;flex-wrap:wrap;margin:0 12px 14px}
.mact button{border:1.5px solid var(--border);border-radius:8px;background:var(--bg);font-size:12px;font-weight:600;padding:6px 10px;cursor:pointer}

/* length popover */
.pop{position:absolute;background:var(--bg);border:1.5px solid var(--ink);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:6px;z-index:40;display:none;flex-direction:column;gap:4px}
.pop.open{display:flex}
.pop button{border:1.5px solid var(--border);border-radius:7px;background:var(--bg);font-size:13px;padding:7px 14px;cursor:pointer;font-weight:600}
.pop button.sel{background:var(--yellow);border-color:#caa52a}

/* desktop */
@media(min-width:780px){
  .body{grid-template-columns:320px 1fr 150px}
  .menu{position:static;transform:none;box-shadow:none;width:auto;max-width:none}
  .app.menu-open .menu,.menu{transform:none}
  .backdrop{display:none}
  .menu-toggle-wrap{display:none}
  .mhead{display:none}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.3/dist/abcjs-basic-min.js"></script>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <span class="menu-toggle-wrap"><button class="tb-btn" id="menuBtn"><span data-i18n="tb.menu">☰ Menü</span></button></span>
    <span class="tb-title">ABC-Editor</span>
    <button class="tb-btn" id="micBtn" title="Singen → Noten">🎤</button>
    <span class="spacer"></span>
    <button class="tb-btn" id="themeBtn" title="Hell/Dunkel">🌙</button>
    <button class="tb-btn" id="playBtn">▶︎</button>
  </div>
  <div class="voicebar" id="voicebar" hidden></div>
  <div class="body">
    <!-- MENU (left on desktop, drawer on mobile) -->
    <div class="menu" id="menu">
      <div class="mhead"><b data-i18n="m.settings">Einstellungen</b>
        <span style="display:flex;gap:6px;align-items:center">
          <select id="langSel" style="width:auto;padding:3px 6px;font-size:12px"><option value="de">DE</option><option value="en">EN</option><option value="ru">RU</option></select>
          <button class="mx" id="menuClose">✕</button></span></div>
      <h3 data-i18n="m.song">Lied</h3>
      <div class="mrow"><label data-i18n="m.title">Titel</label><input id="fTitle" value="Neues Lied"></div>
      <div class="mrow"><label data-i18n="m.composer">Komponist</label><input id="fComposer" placeholder="optional"></div>
      <div class="mrow"><label data-i18n="m.meter">Taktart</label>
        <select id="fMeter"><option>4/4</option><option>3/4</option><option>2/4</option><option>6/8</option><option>C</option></select></div>
      <div class="mrow"><label data-i18n="m.tempo">Tempo (BPM)</label><input id="fTempo" type="number" value="100" min="20" max="240"></div>
      <h3 data-i18n="m.voices">Stimmen</h3>
      <div class="mrow"><label data-i18n="m.mode">Modus</label>
        <select id="fVoiceMode"><option value="single" data-i18n="m.single">Einstimmig</option><option value="multi" data-i18n="m.multi">Mehrstimmig (SATB)</option></select></div>
      <div class="mrow" id="voiceCountRow" hidden><label data-i18n="m.vcount">Anzahl Stimmen</label>
        <select id="fVoiceCount"><option value="2">2 (S/A)</option><option value="3">3 (S/A/T)</option><option value="4">4 (S/A/T/B)</option></select></div>
      <div class="mrow" id="groupRow" hidden><label data-i18n="m.group">Bündelung der Systeme</label>
        <select id="fGroup">
          <option value="single" data-i18n="m.group.single">Jede Stimme einzeln</option>
          <option value="pairs" data-i18n="m.group.pairs">Paarweise (1+2, 3+4)</option>
          <option value="sa" data-i18n="m.group.sa">1+2 zusammen, Rest einzeln</option>
        </select></div>
      <div class="mrow"><label><input type="checkbox" id="fLyrics" style="width:auto;margin-right:6px"><span data-i18n="m.lyrics">Liedtext anzeigen</span></label></div>
      <div id="lyricEditors"></div>
      <div id="voiceEditors"></div>
      <h3 data-i18n="m.mic">Mikrofon (Singen → Noten)</h3>
      <div class="mrow"><label data-i18n="m.range">Stimmlage</label>
        <select id="micRange"><option value="auto" data-i18n="m.range.auto">Automatisch</option><option value="low" data-i18n="m.range.low">Tief (Bass/Tenor)</option><option value="mid" data-i18n="m.range.mid">Mittel</option><option value="high" data-i18n="m.range.high">Hoch (Sopran)</option></select></div>
      <div class="mrow"><label data-i18n="m.gate">Empfindlichkeit (Pegel-Schwelle)</label>
        <input id="micGate" type="range" min="2" max="40" value="10"></div>
      <div class="mrow"><label><input type="checkbox" id="micDsp" style="width:auto;margin-right:6px"><span data-i18n="m.dsp">Browser-Rauschunterdrückung</span></label></div>
      <h3><span data-i18n="m.display">Darstellung</span> <span style="text-transform:none;font-weight:400" data-i18n="m.displayhint">(ändert Noten nicht)</span></h3>
      <div class="mrow" id="clefRow"><label data-i18n="m.clef">Notenschlüssel</label>
        <select id="fClef"><option value="treble" data-i18n="m.clef.treble">Violin</option><option value="bass" data-i18n="m.clef.bass">Bass</option><option value="alto" data-i18n="m.clef.alto">Alt</option></select></div>
      <div class="mrow"><label data-i18n="m.transpose">Transponieren (nur Ansicht)</label>
        <select id="fTranspose">
          <option value="-12">−1 Oktave</option><option value="-5">−4 (Quarte)</option><option value="-2">−2 Halbtöne</option>
          <option value="0" selected>0 (Original)</option>
          <option value="2">+2 Halbtöne</option><option value="5">+5 (Quarte)</option><option value="12">+1 Oktave</option>
        </select></div>
      <h3 data-i18n="m.abc">ABC-Code</h3>
      <textarea id="abcTa" spellcheck="false"></textarea>
      <div class="mact">
        <button id="btnApplyAbc" data-i18n="b.apply">↻ ABC übernehmen</button>
        <button id="btnCopy" data-i18n="b.copy">Kopieren</button>
        <button id="btnAbc">⬇ ABC</button>
        <button id="btnPrint" data-i18n="b.print">🖨 PDF-Vorschau</button>
        <button id="btnMidi" style="display:none">⬇ MIDI</button>
        <button id="btnMp3" style="display:none">⬇ MP3</button>
      </div>
      <h3 data-i18n="m.templates">Vorlagen</h3>
      <div class="mact" id="tplRow"></div>
      <h3 data-i18n="m.saved">Gespeicherte Lieder</h3>
      <div id="savedList" style="margin:0 12px"></div>
      <div class="mact"><button id="btnSaveSong" data-i18n="b.save">＋ Aktuelles Lied speichern</button></div>
    </div>
    <div class="backdrop" id="backdrop"></div>

    <!-- RESULT -->
    <div class="result" id="resultWrap">
      <span id="hint" data-i18n="hint">Tippe rechts eine Note · Grundton unten (orange)</span>
      <div id="paper"></div>
      <div class="micmon" id="micMon" hidden>
        <span class="mm-note" id="mmNote">—</span>
        <span class="mm-freq" id="mmFreq">0 Hz</span>
        <span class="mm-meter"><i id="mmLevel"></i></span>
        <span class="mm-stop" id="mmStop">Stop</span>
      </div>
    </div>

    <!-- KEYBOARD -->
    <div class="kbd">
      <div class="kfnrow">
        <button class="kfn" id="symBtn"><span data-i18n="k.sym">Zeichen</span> ▾</button>
        <button class="kfn y" id="lenBtn">♩ ▾</button>
      </div>
      <div class="keys-scroll" id="keysScroll">
        <div class="keys" id="keys"></div>
      </div>
      <div class="kactrow">
        <button class="kfn" id="pauseBtn" data-i18n="k.pause">Pause</button>
        <button class="kfn" id="barBtn" data-i18n="k.bar">Takt |</button>
        <button class="kfn" id="delBtn" data-i18n="k.del">⌫ Löschen</button>
        <button class="kfn y" id="keyBtn">C-Dur ▾</button>
      </div>
    </div>
  </div>
</div>

<!-- length popover -->
<div class="pop" id="lenPop">
  <button data-len="4"><span data-i18n="len.whole">𝅝 Ganze</span></button>
  <button data-len="2"><span data-i18n="len.half">𝅗𝅥 Halbe</span></button>
  <button data-len="1" class="sel"><span data-i18n="len.quarter">♩ Viertel</span></button>
  <button data-len="/"><span data-i18n="len.eighth">♪ Achtel</span></button>
  <button data-len="//"><span data-i18n="len.sixteenth">𝅘𝅥𝅯 Sechzehntel</span></button>
</div>
<!-- key popover -->
<div class="pop" id="keyPop"></div>
<!-- symbol popover -->
<div class="pop" id="symPop">
  <button data-sym="newline" data-i18n="sym.newline">⏎ Neue Zeile</button>
  <button data-sym="repstart" data-i18n="sym.repstart">|: Wdh. auf</button>
  <button data-sym="repend" data-i18n="sym.repend">:| Wdh. zu</button>
</div>

/* ================= music theory ================= */
const NAT={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const LETTERS=['C','D','E','F','G','A','B'];
const SOLF={C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};
const MAJ=[0,2,4,5,7,9,11], MIN=[0,2,3,5,7,8,10];
const WHITE_PC=[0,2,4,5,7,9,11];

function keyMap(key){
  const intervals=key.mode==='min'?MIN:MAJ;
  const rootPc=((NAT[key.letter]+key.acc)%12+12)%12;
  const rootIdx=LETTERS.indexOf(key.letter);
  const scale={}, sig={};
  for(let i=0;i<7;i++){
    const pc=(rootPc+intervals[i])%12;
    const letter=LETTERS[(rootIdx+i)%7];
    let acc=pc-NAT[letter]; if(acc>6)acc-=12; if(acc<-6)acc+=12;
    scale[pc]={letter,acc,isRoot:pc===rootPc}; sig[letter]=acc;
  }
  const useFlat=Object.values(sig).some(a=>a<0);
  const map={};
  for(let pc=0;pc<12;pc++){
    if(scale[pc]){ const s=scale[pc]; map[pc]={letter:s.letter,acc:s.acc,inScale:true,isRoot:s.isRoot}; }
    else{
      let best=null;
      for(const L of LETTERS){ if(NAT[L]===pc && sig[L]!==undefined && sig[L]!==0){best={letter:L,acc:0};break;} }
      if(!best){
        if(useFlat){ for(const L of LETTERS){ if(((NAT[L]+(sig[L]||0))%12+12)%12===(pc+1)%12){best={letter:L,acc:(sig[L]||0)-1};break;} } }
        else{ for(const L of LETTERS){ if(((NAT[L]+(sig[L]||0))%12+12)%12===(pc+11)%12){best={letter:L,acc:(sig[L]||0)+1};break;} } }
      }
      if(!best)best={letter:'C',acc:0};
      map[pc]={letter:best.letter,acc:best.acc,inScale:false,isRoot:false};
    }
  }
  return {map,sig,rootPc};
}
function accSym(a){return a===0?'':a===1?'♯':a===-1?'♭':a===2?'𝄪':a===-2?'𝄫':'';}
function label(letter,acc){return letter+accSym(acc);}
function solf(letter,acc){return SOLF[letter]+accSym(acc);}
function abcToken(letter,acc,sig,midi){
  const sa=sig[letter]!==undefined?sig[letter]:0;
  let acch=''; if(acc!==sa){ acch=acc===0?'=':acc===1?'^':acc===-1?'_':acc===2?'^^':acc===-2?'__':''; }
  const o=Math.floor(midi/12)-1;
  let L=(o>=5)?letter.toLowerCase():letter.toUpperCase();
  let oct= o>5?"'".repeat(o-5) : o<4?",".repeat(4-o) : '';
  return acch+L+oct;
}

/* key list for the key chooser */
const KEYS=[
  ['C-Dur',{letter:'C',acc:0,mode:'maj'}],['G-Dur',{letter:'G',acc:0,mode:'maj'}],['D-Dur',{letter:'D',acc:0,mode:'maj'}],
  ['A-Dur',{letter:'A',acc:0,mode:'maj'}],['E-Dur',{letter:'E',acc:0,mode:'maj'}],['F-Dur',{letter:'F',acc:0,mode:'maj'}],
  ['B-Dur',{letter:'B',acc:-1,mode:'maj'}],['Es-Dur',{letter:'E',acc:-1,mode:'maj'}],['As-Dur',{letter:'A',acc:-1,mode:'maj'}],
  ['a-Moll',{letter:'A',acc:0,mode:'min'}],['e-Moll',{letter:'E',acc:0,mode:'min'}],['d-Moll',{letter:'D',acc:0,mode:'min'}],
  ['g-Moll',{letter:'G',acc:0,mode:'min'}],['c-Moll',{letter:'C',acc:0,mode:'min'}],['h-Moll',{letter:'B',acc:0,mode:'min'}],
  ['fis-Moll',{letter:'F',acc:1,mode:'min'}],['b-Moll',{letter:'B',acc:-1,mode:'min'}],['es-Moll',{letter:'E',acc:-1,mode:'min'}],
];
function keyAbc(key){ // K: field
  const L=key.letter + (key.acc===1?'#':key.acc===-1?'b':'');
  return L + (key.mode==='min'?'m':'');
}
// parse a K: value like "Bbm", "D", "F#m" into {letter,acc,mode}
function parseKey(s){
  const m=(s||'').match(/^([A-G])(#|b)?(m)?/i); if(!m) return {letter:'C',acc:0,mode:'maj'};
  return {letter:m[1].toUpperCase(), acc:m[2]==='#'?1:m[2]==='b'?-1:0, mode:m[3]?'min':'maj'};
}
// tokenize one ABC body string into tokens, using the current key signature `sig`
function parseBody(body, sig){
  const toks=[]; const lines=body.split('\n');
  lines.forEach((line,li)=>{
    if(li>0) toks.push({t:'',kind:'newline'});
    let i=0; const s=line;
    while(i<s.length){
      const c=s[i];
      if(c===' '||c==='\t'){ i++; continue; }
      if(c==='x'||c==='X'){ // placeholder rest – skip with its length
        i++; while(i<s.length&&/[0-9\/]/.test(s[i]))i++; continue;
      }
      // bar / repeat
      if(c==='|'||c===':'){ let bar=''; while(i<s.length&&/[|:\]\[]/.test(s[i])){bar+=s[i];i++;} if(bar) toks.push({t:bar,kind:'bar'}); continue; }
      // rest
      if(c==='z'||c==='Z'){ let r='z'; i++; let suf=''; while(i<s.length&&/[0-9\/]/.test(s[i])){suf+=s[i];i++;} toks.push({t:'z'+suf,kind:'rest'}); continue; }
      // note: optional accidental, letter, octave marks, length
      const nm=s.slice(i).match(/^(\^\^|__|\^|_|=)?([A-Ga-g])([,']*)([0-9]*\/*[0-9]*)/);
      if(nm){
        const accCh=nm[1]||'', L=nm[2], oct=nm[3]||'', suf=nm[4]||'';
        const letter=L.toUpperCase();
        let acc = accCh==='^'?1:accCh==='_'?-1:accCh==='='?0:accCh==='^^'?2:accCh==='__'?-2: (sig[letter]!==undefined?sig[letter]:0);
        let o = (L===L.toLowerCase())?5:4;
        for(const ch of oct){ if(ch===',')o--; else if(ch==="'")o++; }
        const midi = 12*(o+1) + NAT[letter] + acc;
        toks.push({t:accCh+L+oct+suf, kind:'note', midi});
        i+=nm[0].length; continue;
      }
      i++; // skip unknown char
    }
  });
  // drop a trailing empty newline
  while(toks.length && toks[toks.length-1].kind==='newline') toks.pop();
  return toks;
}
// parse a full ABC string back into state; returns true on success
function loadAbc(abc){
  try{
    const km=abc.match(/^K:\s*(\S+)/m); state.key = km?parseKey(km[1]):{letter:'C',acc:0,mode:'maj'};
    KM=keyMap(state.key);
    const tm=abc.match(/^T:(.*)$/m); $('fTitle').value=tm?tm[1].trim():'';
    const cm=abc.match(/^C:(.*)$/m); $('fComposer').value=cm?cm[1].trim():'';
    const mm=abc.match(/^M:(.*)$/m); if(mm)$('fMeter').value=mm[1].trim();
    const qm=abc.match(/^Q:(?:[^=\n]*=)?(\d+)/m); if(qm)$('fTempo').value=qm[1];
    const multi = /^%%score|^%%staves|^V:/m.test(abc);
    // reset voices
    state.voices=[newVoice(VOICE_DEFS[0]),newVoice(VOICE_DEFS[1]),newVoice(VOICE_DEFS[2]),newVoice(VOICE_DEFS[3])];
    const idIndex={S:0,A:1,T:2,B:3,'1':0,'2':1,'3':2,'4':3};
    let foundLyric=false;
    if(multi){
      const lines=abc.split('\n'); let cur=-1, bodies=['','','',''];
      const vdef=/^V:\s*(\S+)(.*)$/;
      for(const line of lines){
        if(/^w:/.test(line)){ if(cur>=0){ state.voices[cur].lyrics=line.replace(/^w:\s?/,''); foundLyric=true; } continue; }
        if(/^[A-Za-z]:/.test(line) && !/^V:/.test(line)) continue;      // other header
        if(line.startsWith('%')) continue;
        const vm=line.match(vdef);
        if(vm){ cur=idIndex[vm[1]]!==undefined?idIndex[vm[1]]:-1;
          if(cur>=0){ const cl=(vm[2].match(/clef=(\w+)/)||[])[1]; if(cl)state.voices[cur].clef=cl;
            const nn=(vm[2].match(/name="([^"]*)"/)||[])[1]; if(nn)state.voices[cur].name=nn; }
          continue; }
        // inline [V:x] prefix
        const inl=line.match(/^\[V:\s*(\S+?)\]\s*(.*)$/);
        if(inl){ const vi=idIndex[inl[1]]; if(vi!==undefined){ cur=vi; bodies[vi]+=(bodies[vi]?'\n':'')+inl[2]; } continue; }
        if(cur>=0){ bodies[cur]+=(bodies[cur]?'\n':'')+line; }
      }
      let n=0;
      for(let vi=0;vi<4;vi++){ if(bodies[vi].trim()){ state.voices[vi].tokens=parseBody(bodies[vi],KM.sig); n=Math.max(n,vi+1); } }
      state.voiceMode='multi'; state.voiceCount=Math.max(2,Math.min(4,n)); state.activeVoice=0;
      // detect staff grouping from the %%score/%%staves spec
      const sp=(abc.match(/^%%(?:score|staves)\s+(.*)$/m)||[])[1]||'';
      state.grouping = /\([^)]*\s[^)]*\)/.test(sp) ? (/\)\s*\(/.test(sp)?'pairs':'sa') : 'single';
      $('fVoiceMode').value='multi'; $('fVoiceCount').value=String(state.voiceCount); $('fGroup').value=state.grouping;
    } else {
      // single: body = lines after K: that aren't headers
      const lines=abc.split('\n'); let started=false, body='';
      for(const line of lines){
        if(/^K:/.test(line)){ started=true; continue; }
        if(!started) continue;
        if(/^w:/.test(line)){ state.voices[0].lyrics=line.replace(/^w:\s?/,''); foundLyric=true; continue; }
        if(/^[A-Za-z]:/.test(line)||line.startsWith('%')) continue;
        body+=(body?'\n':'')+line;
      }
      const cl=(abc.match(/^K:[^\n]*clef=(\w+)/m)||[])[1]; if(cl){ state.voices[0].clef=cl; $('fClef').value=cl; }
      state.voices[0].tokens=parseBody(body,KM.sig);
      state.voiceMode='single'; state.activeVoice=0; $('fVoiceMode').value='single';
    }
    if(foundLyric){ state.lyricsOn=true; $('fLyrics').checked=true; }
    $('keyBtn').textContent=keyLabel()+' ▾';
    $('voiceCountRow').hidden=(state.voiceMode!=='multi');
    $('groupRow').hidden=(state.voiceMode!=='multi');
    $('clefRow').hidden=(state.voiceMode==='multi');
    buildVoicebar(); buildVoiceEditors(); buildLyricEditors(); buildKeyboard(); scrollToRoot(); render(true);
    return true;
  }catch(e){ console.warn('loadAbc',e); return false; }
}

/* ================= voices ================= */
const VOICE_DEFS=[
  {id:'S',name:'Sopran',clef:'treble',lo:60,hi:84},
  {id:'A',name:'Alt',   clef:'treble',lo:55,hi:79},
  {id:'T',name:'Tenor', clef:'treble',lo:48,hi:72},
  {id:'B',name:'Bass',  clef:'bass',  lo:40,hi:64},
];
const VOICE_COLORS=['#185FA5','#C94F00','#1E5C0A','#7A4AC0'];
function newVoice(def){ return {name:def.name,clef:def.clef,lo:def.lo,hi:def.hi,tokens:[],cursor:0,sel:-1,lyrics:''}; }

/* ================= state ================= */
const state={
  key:{letter:'C',acc:0,mode:'maj'},
  len:'1',               // '4','2','1','/','//'
  voiceMode:'single',    // 'single' | 'multi'
  voiceCount:2,          // voices used in multi mode (2..4)
  activeVoice:0,         // 0-based index into voices
  grouping:'pairs',      // 'single' | 'pairs' | 'sa'  (staff bundling in multi)
  lyricsOn:false,        // show w: lyrics lines
  transpose:0,           // view-only visualTranspose (semitones)
  voices:[newVoice(VOICE_DEFS[0]),newVoice(VOICE_DEFS[1]),newVoice(VOICE_DEFS[2]),newVoice(VOICE_DEFS[3])],
};
function AV(){ return state.voices[state.activeVoice]; }
function nActive(){ return state.voiceMode==='single'?1:state.voiceCount; }
let KM=keyMap(state.key);
let visualObj=null, synth=null;

/* ================= keyboard rendering ================= */
function buildKeyboard(){
  const keys=$('keys'); keys.innerHTML='';
  const WH=38, GAP=4, PITCH=WH+GAP;          // white key pitch
  const lo=AV().lo, hi=AV().hi;
  // whites from high (top) to low (bottom)
  const whites=[]; for(let m=hi;m>=lo;m--){ if(WHITE_PC.includes(((m%12)+12)%12)) whites.push(m); }
  keys.style.height=(whites.length*PITCH+20)+'px';
  whites.forEach((m,idx)=>{
    const pc=((m%12)+12)%12, info=KM.map[pc];
    const el=document.createElement('div');
    el.className='wk'+(info.isRoot?' root':info.inScale?' inkey':'');
    el.style.top=(idx*PITCH)+'px'; el.style.position='absolute'; el.style.left='0'; el.style.right='0';
    el.innerHTML=`${label(info.letter,info.acc)} <span class="sf">${solf(info.letter,info.acc)}</span>`;
    el.onclick=()=>insertNote(m);
    keys.appendChild(el);
  });
  // blacks: sit at the boundary just below each white that has a black below it
  whites.forEach((m,idx)=>{
    const below=m-1, pcB=((below%12)+12)%12;
    if(!WHITE_PC.includes(pcB)){            // there is a black between this white and the next lower
      const info=KM.map[pcB];
      const el=document.createElement('div');
      el.className='bk'+(info.isRoot?' root':info.inScale?' inkey':'');
      el.style.top=(idx*PITCH+WH-12)+'px';
      el.textContent=label(info.letter,info.acc);
      el.title=solf(info.letter,info.acc);
      el.onclick=(e)=>{e.stopPropagation();insertNote(below);};
      keys.appendChild(el);
    }
  });
}
function scrollToRoot(){
  // start with a root near the middle octave sitting at the bottom of the view
  const sc=$('keysScroll');
  requestAnimationFrame(()=>{
    const roots=[...$('keys').querySelectorAll('.root')];
    if(!roots.length){ sc.scrollTop=sc.scrollHeight; return; }
    const mid=$('keys').offsetHeight/2;
    let best=roots[0], bd=1e9;
    roots.forEach(r=>{ const d=Math.abs(r.offsetTop-mid); if(d<bd){bd=d;best=r;} });
    sc.scrollTop = Math.max(0, best.offsetTop + best.offsetHeight - sc.clientHeight + 8);
  });
}

/* ================= editing (token model) ================= */
function lenSuffix(){ return state.len==='1'?'':state.len; }
function tokenFor(midi){
  const pc=((midi%12)+12)%12, info=KM.map[pc];
  return abcToken(info.letter,info.acc,KM.sig,midi)+lenSuffix();
}
function insertNote(midi){
  const v=AV();
  v.tokens.splice(v.cursor,0,{t:tokenFor(midi),kind:'note',midi});
  v.cursor++; v.sel=v.cursor-1;
  playMidi(midi); render(true);
}
function insertRaw(s,kind){
  const v=AV();
  v.tokens.splice(v.cursor,0,{t:s,kind:kind||'sym'});
  v.cursor++; v.sel=-1; render(true);
}
function delAtCursor(){
  const v=AV();
  if(v.cursor>0){ v.tokens.splice(v.cursor-1,1); v.cursor--; }
  v.sel=-1; render(true);
}
// move a note's pitch by diatonic steps within the current scale
function scalePitches(){
  const arr=[]; for(let m=24;m<=96;m++){ const pc=((m%12)+12)%12; if(KM.map[pc].inScale) arr.push(m); }
  return arr;
}
function changePitch(vIdx, idx, step){
  const tk=state.voices[vIdx].tokens[idx]; if(!tk||tk.kind!=='note')return;
  const suf=(tk.t.match(/[0-9\/]+$/)||[''])[0];     // keep length suffix
  const sp=scalePitches();
  let ni=0, bd=1e9; sp.forEach((m,i)=>{const d=Math.abs(m-tk.midi); if(d<bd){bd=d;ni=i;}});
  const nm=sp[Math.max(0,Math.min(sp.length-1, ni+step))];
  const pc=((nm%12)+12)%12, info=KM.map[pc];
  tk.midi=nm; tk.t=abcToken(info.letter,info.acc,KM.sig,nm)+suf;
  playMidi(nm); render(true);
}

/* ================= render ================= */
// lastMap: absolute char ranges across the whole ABC string -> {v,i,kind}
let lastMap=[];
function buildVoiceBody(v){
  let str=''; const ranges=[];
  v.tokens.forEach((tk,i)=>{
    if(i>0) str+=(tk.kind==='newline'?'':' ');
    const start=str.length;
    str+=(tk.kind==='newline'?'\n':tk.t);
    ranges.push({i,start,end:str.length,kind:tk.kind});
  });
  if(!str) str='x8|';   // placeholder bar so empty voice still renders a staff
  return {str,ranges};
}
function fullAbc(){
  let h='X:1\n';
  if($('fTitle').value) h+='T:'+$('fTitle').value+'\n';
  if($('fComposer').value) h+='C:'+$('fComposer').value+'\n';
  h+='M:'+$('fMeter').value+'\n';
  h+='L:1/4\n';
  if($('fTempo').value) h+='Q:1/4='+$('fTempo').value+'\n';
  lastMap=[];
  const n=nActive();
  let out;
  if(n===1){
    const v=state.voices[0];
    h+='K:'+keyAbc(state.key)+' clef='+v.clef+'\n';
    const bb=buildVoiceBody(v);
    bb.ranges.forEach(r=>lastMap.push({v:0,i:r.i,start:h.length+r.start,end:h.length+r.end,kind:r.kind}));
    out=h+bb.str;
    if(state.lyricsOn && v.lyrics.trim()) out+='\nw: '+v.lyrics.trim();
  } else {
    h+='%%score '+scoreSpec(n)+'\n';
    h+='K:'+keyAbc(state.key)+'\n';
    out=h;
    for(let vi=0; vi<n; vi++){
      const v=state.voices[vi], def=VOICE_DEFS[vi];
      out+='V:'+def.id+' clef='+v.clef+' name="'+(v.name||def.name).replace(/"/g,'')+'"\n';
      const bb=buildVoiceBody(v);
      bb.ranges.forEach(r=>lastMap.push({v:vi,i:r.i,start:out.length+r.start,end:out.length+r.end,kind:r.kind}));
      out+=bb.str+'\n';
      if(state.lyricsOn && v.lyrics.trim()) out+='w: '+v.lyrics.trim()+'\n';
    }
  }
  return out;
}
// staff bundling: braces group the choir, parens share a staff
function scoreSpec(n){
  const id=i=>VOICE_DEFS[i].id;
  if(state.grouping==='single'){ const a=[]; for(let i=0;i<n;i++)a.push(id(i)); return '{'+a.join(' ')+'}'; }
  if(state.grouping==='sa'){ // 1+2 on one staff, rest single
    let p='('+id(0)+(n>1?' '+id(1):'')+')'; for(let i=2;i<n;i++)p+=' '+id(i); return '{'+p+'}';
  }
  // pairs: (1 2) (3 4)
  let parts=[]; for(let i=0;i<n;i+=2){ if(i+1<n) parts.push('('+id(i)+' '+id(i+1)+')'); else parts.push(id(i)); }
  return '{'+parts.join(' ')+'}';
}
let rt=null;
function render(fromButtons){
  if(fromButtons){ $('abcTa').value=fullAbc(); }
  clearTimeout(rt);
  rt=setTimeout(()=>{
    try{
      const arr=ABCJS.renderAbc('paper', $('abcTa').value, {
        responsive:'resize', add_classes:true, dragging:true, selectTypes:['note'],
        staffwidth: Math.max(240,$('resultWrap').clientWidth-24),
        visualTranspose: state.transpose||0,
        clickListener:onNoteClick
      });
      visualObj=arr&&arr[0];
      paintSelection();
    }catch(e){ console.warn(e); }
  }, 60);
}
function locAtChar(startChar){
  for(const r of lastMap){ if(startChar>=r.start && startChar<r.end) return r; }
  return null;
}
function onNoteClick(abcElem, tn, classes, analysis, drag, ev){
  if(abcElem.startChar==null) return;
  const loc=locAtChar(abcElem.startChar);
  if(!loc) return;
  const vo=state.voices[loc.v], tk=vo.tokens[loc.i];
  if(drag && drag.step && vo.sel>=0 && vo.tokens[vo.sel] && vo.tokens[vo.sel].kind==='note'){
    changePitch(loc.v, vo.sel, drag.step); return;
  }
  if(loc.v!==state.activeVoice && state.voiceMode==='multi'){ setActiveVoice(loc.v); }
  if(tk && tk.kind==='note'){ vo.sel=loc.i; vo.cursor=loc.i+1; playMidi(tk.midi); paintSelection(); }
}
function paintSelection(){
  const paper=$('paper');
  paper.querySelectorAll('.sel-note').forEach(e=>e.classList.remove('sel-note'));
  const v=AV();
  if(v.sel<0||!v.tokens[v.sel]||v.tokens[v.sel].kind!=='note') return;
  // index of selected note among all note elements, in document order across voices
  let count=0, target=-1;
  for(let vi=0; vi<nActive(); vi++){
    const vo=state.voices[vi];
    vo.tokens.forEach((t,i)=>{ if(t.kind==='note'){ if(vi===state.activeVoice && i===v.sel) target=count; count++; } });
  }
  const noteEls=paper.querySelectorAll('.abcjs-note');
  if(target>=0 && noteEls[target]) noteEls[target].classList.add('sel-note');
}

/* ================= voices UI ================= */
function setActiveVoice(vi){
  state.activeVoice=vi;
  [...$('voicebar').children].forEach((b,i)=>b.classList.toggle('active',i===vi));
  buildKeyboard(); scrollToRoot();
  $('keyBtn').textContent=keyLabel()+' ▾';
  paintSelection();
}
function buildVoicebar(){
  const vb=$('voicebar');
  if(state.voiceMode==='single'){ vb.hidden=true; vb.innerHTML=''; return; }
  vb.hidden=false; vb.innerHTML='';
  for(let vi=0; vi<state.voiceCount; vi++){

/* ================= microphone → notes (YIN, offline) ================= */
let micState=null;
const micCfg={ gate:0.010, stableFrames:2, smoothWin:5, range:'auto', browserDsp:false };
const MIC_RANGES={ auto:[70,1200], low:[70,400], mid:[130,700], high:[250,1100] };
const MIC_NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
function micName(m){ return MIC_NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1); }
function yinDetect(buf, sr, gate){
  const SIZE=buf.length, half=SIZE>>1;
  let rms=0; for(let i=0;i<SIZE;i++){const v=buf[i];rms+=v*v;} rms=Math.sqrt(rms/SIZE);
  if(rms<gate) return {freq:-1,rms};
  const yin=new Float32Array(half);
  for(let tau=1;tau<half;tau++){ let s=0; for(let i=0;i<half;i++){const d=buf[i]-buf[i+tau];s+=d*d;} yin[tau]=s; }
  yin[0]=1; let run=0;
  for(let tau=1;tau<half;tau++){ run+=yin[tau]; yin[tau]= run>0?yin[tau]*tau/run:1; }
  const TH=0.18; let tau=-1;
  for(let t=2;t<half;t++){ if(yin[t]<TH){ while(t+1<half&&yin[t+1]<yin[t])t++; tau=t; break; } }
  if(tau===-1) return {freq:-1,rms};
  const x0=tau>1?tau-1:tau, x2=tau+1<half?tau+1:tau; let bt=tau;
  if(x0!==tau&&x2!==tau){ const s0=yin[x0],s1=yin[tau],s2=yin[x2],dn=(2*s1-s2-s0); if(dn!==0) bt=tau+(s2-s0)/(2*dn); }
  return {freq:sr/bt,rms};
}
function micMedian(arr){ const a=arr.slice().sort((x,y)=>x-y),m=a.length>>1; return a.length%2?a[m]:Math.round((a[m-1]+a[m])/2); }
function micLoop(){
  if(!micState) return;
  micState.analyser.getFloatTimeDomainData(micState.buf);
  const {freq,rms}=yinDetect(micState.buf, micState.ctx.sampleRate, micCfg.gate);
  const [fmin,fmax]=MIC_RANGES[micCfg.range]||MIC_RANGES.auto;
  const voiced= freq>0 && freq>=fmin && freq<=fmax;
  $('mmLevel').style.width=Math.min(100,Math.round(rms*450))+'%';
  if(voiced){
    const midi=Math.round(69+12*Math.log2(freq/440));
    const h=micState.hist; h.push(midi); while(h.length>micCfg.smoothWin) h.shift();
    const smooth=micMedian(h);
    if(micState.cand===smooth){ micState.candCount++; } else { micState.cand=smooth; micState.candCount=1; }
    const onset= micState.pendingOnset || (rms>micState.prevRms*1.6 && rms>micCfg.gate*2);
    micState.prevRms=rms;
    $('mmNote').textContent=micName(smooth); $('mmFreq').textContent=Math.round(freq)+' Hz';
    if(micState.candCount>=micCfg.stableFrames && (smooth!==micState.emitted || onset)){
      insertNote(smooth);
      micState.emitted=smooth; micState.pendingOnset=false; micState.candCount=0;
    }
    micState.silence=0;
  } else {
    micState.prevRms=rms; micState.silence++;
    $('mmNote').textContent='—'; $('mmFreq').textContent='0 Hz';
    if(micState.silence>=3){ micState.pendingOnset=true; micState.emitted=null; micState.cand=null; micState.candCount=0; micState.hist.length=0; }
  }
  micState.raf=requestAnimationFrame(micLoop);
}
async function startMic(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert('Mikrofon wird nicht unterstützt'); return; }
  try{
    const dsp=micCfg.browserDsp;
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:dsp,noiseSuppression:dsp,autoGainControl:false}});
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended'){ try{ await ctx.resume(); }catch(e){} }
    const src=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser(); analyser.fftSize=2048; src.connect(analyser);
    micState={stream,ctx,analyser,buf:new Float32Array(analyser.fftSize),emitted:null,cand:null,candCount:0,silence:0,hist:[],prevRms:0,pendingOnset:true,raf:null};
    $('micBtn').classList.add('listening'); $('micMon').hidden=false;
    micLoop();
  }catch(e){ alert('Kein Zugriff auf das Mikrofon'); }
}
function stopMic(){
  if(!micState) return;
  cancelAnimationFrame(micState.raf);
  try{ micState.stream.getTracks().forEach(tr=>tr.stop()); }catch(e){}
  try{ micState.ctx.close(); }catch(e){}
  micState=null;
  $('micBtn').classList.remove('listening'); $('micMon').hidden=true;
}

function f32ToI16(f){ const o=new Int16Array(f.length); for(let i=0;i<f.length;i++){let s=f[i];s=s<-1?-1:s>1?1:s;o[i]=s<0?s*0x8000:s*0x7FFF;} return o; }
function audioBuffersToMp3(abs){
  let len=0,sr=44100,ch=1;
  abs.forEach(ab=>{ if(ab.length>len)len=ab.length; sr=ab.sampleRate; if(ab.numberOfChannels>ch)ch=ab.numberOfChannels; });
  ch=Math.min(ch,2);
  const mix=[]; for(let c=0;c<ch;c++) mix.push(new Float32Array(len));
  abs.forEach(ab=>{ for(let c=0;c<ch;c++){ const src=ab.getChannelData(Math.min(c,ab.numberOfChannels-1)),dst=mix[c]; for(let i=0;i<src.length;i++) dst[i]+=src[i]; } });
  const enc=new lamejs.Mp3Encoder(ch,sr,128);
  const L=f32ToI16(mix[0]),R=ch>1?f32ToI16(mix[1]):null,block=1152,out=[];
  for(let i=0;i<len;i+=block){ const mp3=R?enc.encodeBuffer(L.subarray(i,i+block),R.subarray(i,i+block)):enc.encodeBuffer(L.subarray(i,i+block)); if(mp3.length)out.push(mp3); }
  const end=enc.flush(); if(end.length)out.push(end);
  let total=0; out.forEach(a=>total+=a.length);
  const res=new Uint8Array(total); let off=0; out.forEach(a=>{res.set(a,off);off+=a.length;});
  return res;
}
$('btnMp3').onclick=async()=>{
  if(!visualObj)return;
  if(typeof lamejs==='undefined'){ alert('MP3-Encoder nicht geladen'); return; }
  try{
    const buf=new ABCJS.synth.CreateSynth();
    await buf.init({visualObj,options:{soundFontUrl:SOUNDFONT_URL,soundFontVolumeMultiplier:SOUNDFONT_VOL}});
    await buf.prime();
    const abs=buf.audioBuffers;
    if(!abs||!abs.length||!abs[0].getChannelData) throw new Error('kein Audiopuffer');
    const mp3=audioBuffersToMp3(abs);
    let bin=''; const CH=0x8000;
    for(let i=0;i<mp3.length;i+=CH) bin+=String.fromCharCode.apply(null,mp3.subarray(i,i+CH));
    AndroidExport.save('data:audio/mpeg;base64,'+btoa(bin),'audio/mpeg');
  }catch(e){ alert('MP3: '+e.message); }
};
