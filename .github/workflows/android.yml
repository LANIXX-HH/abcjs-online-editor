name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version (z. B. v1.0.0). Leer = nur Build, kein Release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK (platform-34, build-tools,
      # accepted licenses); AGP finds it via ANDROID_HOME. No setup-android
      # step needed — it currently fails trying to install the obsolete
      # 'tools' package.

      - name: Embed web app + abcjs + lamejs into the app (offline)
        run: |
          set -e
          ASSETS=android/app/src/main/assets
          cp index.html "$ASSETS/index.html"
          curl -fsSL -o "$ASSETS/abcjs-basic-min.js" \
            https://cdn.jsdelivr.net/npm/abcjs@6.4.3/dist/abcjs-basic-min.js
          # MP3 encoder — only bundled in the app, so the web page stays lean
          curl -fsSL -o "$ASSETS/lame.min.js" \
            https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js
          # Point the <script> at the local abcjs and load lamejs right after it
          sed -i 's#https://cdn\.jsdelivr\.net/npm/abcjs@6\.4\.3/dist/abcjs-basic-min\.js#abcjs-basic-min.js#' \
            "$ASSETS/index.html"
          sed -i 's#<script src="abcjs-basic-min.js"></script>#<script src="abcjs-basic-min.js"></script><script src="lame.min.js"></script>#' \
            "$ASSETS/index.html"
          echo "Assets prepared:"; ls -la "$ASSETS"

      - name: Bundle piano soundfont (offline audio + MP3)
        run: |
          set -e
          ASSETS=android/app/src/main/assets
          # Grab just the grand-piano mp3 notes (abcjs soundfont format)
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/paulrosen/midi-js-soundfonts sf
          git -C sf sparse-checkout set abcjs/acoustic_grand_piano-mp3
          mkdir -p "$ASSETS/soundfont"
          cp -r sf/abcjs/acoustic_grand_piano-mp3 "$ASSETS/soundfont/"
          rm -rf sf
          echo "Soundfont notes: $(ls "$ASSETS/soundfont/acoustic_grand_piano-mp3" | wc -l) files"

      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: abc-editor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Determine the release tag: from a pushed tag, or from the manual input.
      - name: Resolve release tag
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK for release
        if: steps.ver.outputs.tag != ''
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "ABC-Editor-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish Release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ABC Editor ${{ steps.ver.outputs.tag }}
          files: ABC-Editor-${{ steps.ver.outputs.tag }}.apk
          generate_release_notes: true
          body: |
            Android-App (Debug-signiert, installierbar). APK unten unter **Assets** herunterladen.
            Installation: Datei öffnen und „Aus unbekannten Quellen installieren" erlauben.
